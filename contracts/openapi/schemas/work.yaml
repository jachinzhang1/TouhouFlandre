# 作品 schema：Work 及共用枚举
# 对应 packages/shared/src/types.ts

WorkType:
  type: string
  enum:
    - game
    - ftg
    - stg
    - print
    - music_cd
    - other

Work:
  type: object
  required:
    - id
    - titleZh
    - titleJa
    - shortName
    - pinyinInitials
    - type
    - releaseYear
  properties:
    id:
      type: string
      minLength: 1
    titleZh:
      type: string
      minLength: 1
    titleJa:
      type: string
      minLength: 1
    titleEn:
      type: string
    shortName:
      type: string
      minLength: 1
    pinyinInitials:
      type: array
      description: 作品中文标题的稳定拼音首字母检索词（简称与全称）。
      minItems: 1
      items:
        type: string
        pattern: "^[a-z0-9]+$"
    type:
      $ref: "#/WorkType"
    releaseYear:
      type: integer
    mainlineIndex:
      type: integer
    era:
      $ref: "./character.yaml#/Era"
