groups:
  - name: multiplayer-relay
    rules:
      - alert: MultiplayerAPIDown
        expr: up{job="touhouflandre-api"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: Multiplayer API metrics target is unavailable

      - alert: MultiplayerDeadlockDetected
        expr: increase(touhouflandre_multi_deadlocks_total[5m]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: PostgreSQL reported a multiplayer deadlock

      - alert: RelaySettlementRecoveryRequired
        expr: increase(touhouflandre_multi_settlement_retries_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Relay settlement required recovery processing

      - alert: RelayHistoryLatencyHigh
        expr: histogram_quantile(0.95, sum by (le, mode, rule_set_key, rule_set_version) (rate(touhouflandre_multi_history_latency_seconds_bucket[10m]))) > 1.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Relay history p95 exceeds the 1500ms rollout threshold

      - alert: MultiplayerSlowConsumerDrops
        expr: increase(touhouflandre_multi_ws_queue_drops_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: WebSocket clients were disconnected because their send queue filled

      - alert: RelayQuestionPoolTooSmall
        expr: increase(touhouflandre_multi_pool_too_small_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: A relay stage could not allocate distinct answers

  - name: hybrid-search
    rules:
      - alert: CharacterSearchFallbackSpike
        expr: sum(increase(touhouflandre_search_fallback_reason_total{reason=~"policy_unavailable|index_transient|index_invalid|engine_error|unknown"}[5m])) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Character search fallbacks increased unexpectedly

      - alert: CharacterSearchProviderFailure
        expr: sum(increase(touhouflandre_search_source_total{outcome="load_error"}[5m])) + sum(increase(touhouflandre_search_snapshot_total{outcome=~"load_error|build_error|unsupported_schema"}[5m])) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: Character search source or snapshot provider failed

      - alert: CharacterSearchRemoteError
        expr: sum(increase(touhouflandre_search_remote_total{outcome="error"}[5m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Character search remote fallback returned an error
