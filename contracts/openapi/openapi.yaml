      $ref: ./schemas/multi-room.yaml#/JoinRoomResponse
    RoomSnapshot:
      $ref: ./schemas/multi-room.yaml#/RoomSnapshot
    MatchView:
      $ref: ./schemas/multi-match.yaml#/MatchView
    RoundView:
      $ref: ./schemas/multi-round.yaml#/RoundView
    OpponentRow:
      $ref: ./schemas/multi-round.yaml#/OpponentRow
    RelayTurnRow:
      $ref: ./schemas/multi-round.yaml#/RelayTurnRow
    GuessResponse:
      $ref: ./schemas/multi-round.yaml#/GuessResponse
    ChatMessage:
      $ref: ./schemas/multi-chat.yaml#/ChatMessage
    SendChatMessageRequest:
      $ref: ./schemas/multi-chat.yaml#/SendChatMessageRequest
    ChatHistoryResponse:
      $ref: ./schemas/multi-chat.yaml#/ChatHistoryResponse
    ChatResyncRequiredResponse:
      $ref: ./schemas/multi-chat.yaml#/ChatResyncRequiredResponse
    RateLimitedErrorResponse:
