# touhouflandre-multi.v2 WebSocket 子协议规范
#
# 依据：docs/multiplayer.md（WebSocket 协议）
# 校验：scripts/check-ws-protocol.mjs（`task check:ws-protocol` / CI）
#   - examples.valid 逐一通过 schema 校验与连接时序校验
#   - examples.invalid 必须失败（正反例双测）
#   - TS 类型（packages/shared/src/multi.ts）payload 字段名集合与 events/clientMessages 对齐

info:
  version: "2.0"
  description: |
    touhouflandre-multi.v2：多人房间游戏事件同步协议。
    传输：GET /api/rooms/{roomId}/ws 升级（Origin ∈ WEB_ORIGINS、子协议 touhouflandre-multi.v2）。
    鉴权：建连后第一条消息必须是 hello{token, lastGameSequence}；鉴权前不收发房间事件。
    令牌只在首帧出现，不进 URL/查询参数/日志。

# 业务事件信封。sequence 由 room_event.sequence 持久化，房间内单调递增。
envelope:
  type: object
  additionalProperties: false
  required: [type, eventId, roomId, sequence, occurredAt, payload]
  properties:
    type:
      type: string
      description: 事件类型，见 events 表。
    eventId:
      type: string
    roomId:
      type: string
    sequence:
      type: integer
      description: 房间内单调递增事件序号。
    occurredAt:
      type: string
      format: date-time
    payload:
      type: object

# 观察者无权或无需消费业务 payload 时发送同 sequence 的连续性占位帧。
cursorEnvelope:
  type: object
  additionalProperties: false
  required: [type, eventId, roomId, sequence, occurredAt]
  properties:
    type:
      type: string
      const: room.cursor
    eventId:
      type: string
    roomId:
      type: string
    sequence:
      type: integer
      minimum: 1
    occurredAt:
      type: string
      format: date-time

# 独立聊天帧；不使用 room event 信封，也没有游戏 sequence。
chatFrame:
  type: object
  additionalProperties: false
  required:
    [
      type,
      messageId,
      roomId,
      senderMemberId,
      senderDisplayName,
      senderRole,
      kind,
      content,
      channel,
      cursor,
      createdAt,
    ]
  properties:
    type:
      type: string
      const: chat.message
    messageId:
      type: string
    roomId:
      type: string
    senderMemberId:
      type: string
    senderDisplayName:
      type: string
    senderRole:
      type: string
      enum: [player, spectator]
    senderSeat:
      type: integer
      minimum: 1
      maximum: 8
    kind:
      type: string
      enum: [text, emoji]
    content:
      type: string
    channel:
      type: string
      enum: [room, spectator]
    cursor:
      type: string
    createdAt:
      type: string
      format: date-time

# 握手流程：升级校验 → hello → 注册缓冲 → 捕获水位 → hello-ok → 重放/排空 → sync.complete → 实时流
handshake:
  - step: upgrade
    detail: "校验 Origin 与 Sec-WebSocket-Protocol: touhouflandre-multi.v2；不符拒绝升级。"
  - step: hello
    detail: 第一条消息必须是 hello{token, lastGameSequence}；鉴权失败/非首帧 → 关闭连接。
  - step: buffer
    detail: 鉴权后先注册为 buffering，再捕获房间游戏事件高水位。
  - step: hello-ok
    detail: 下发 hello-ok{roomId, targetGameSequence}；仅声明目标水位，不表示同步完成。
  - step: replay
    detail: 重放至目标水位；每个 sequence 为业务事件或 room.cursor，再排空较新的缓冲帧。
  - step: complete
    detail: FIFO 队尾发送 sync.complete{gameSequence} 后切入实时流。
  - step: replace
    detail: 同成员新连接注册或 member role 变化时，旧连接收到 replaced 帧后关闭并重新鉴权；仅降容压紧 seat 时保留同一连接和 memberId，并使用最新 seat 投影。

# 服务端 → 客户端事件（08 §8.3 全表）
# observer: all = 全体成员；opponent = 仅对手；spectator = 仅观战者（逐观察者投影）
events:
  - type: room.updated
    observer: all
    summary: 大厅任何成员变化/就绪（玩家列表全量视图，无独立 join/leave 事件）。
    payload:
      type: object
      additionalProperties: false
      required:
        [
          format,
          mode,
          turnSeconds,
          playerLimit,
          raceEliminationEnabled,
          minPlayers,
          playerCount,
          availableSeats,
          members,
          spectatorCount,
        ]
      properties:
        format:
          type: string
          enum: [bo1, bo3, bo5, bo7]
        mode:
          type: string
          enum: [race, relay]
        turnSeconds:
          type: integer
          enum: [30, 60, 90, 120]
        playerLimit:
          type: integer
          minimum: 2
          maximum: 8
        raceEliminationEnabled:
          type: boolean
        minPlayers:
          type: integer
          enum: [2]
        playerCount:
          type: integer
          minimum: 0
          maximum: 8
        availableSeats:
          type: integer
          minimum: 0
          maximum: 8
        members:
          type: array
          description: PK 玩家视图，不含观战者。
          items:
            type: object
            additionalProperties: false
            required: [memberId, seat, displayName, status, ready]
            properties:
              memberId:
                type: string
              seat:
                type: integer
                minimum: 1
                maximum: 8
              displayName:
                type: string
              status:
                type: string
                enum: [connected, disconnected, left]
              ready:
                type: boolean
        spectatorCount:
          type: integer
          minimum: 0

  - type: match.started
    observer: all
    summary: 当前完整 roster 就绪 / 确认再来一局（新场次开始，比分与抽题池自然重置）。
    payload:
      type: object
      additionalProperties: false
      required:
        [
          format,
          mode,
          turnSeconds,
          targetWins,
          catalogVersion,
          matchIndex,
          questionScope,
          scoringMode,
          rosterSize,
          maxRounds,
        ]
      properties:
        format:
          type: string
          enum: [bo1, bo3, bo5, bo7]
        mode:
          type: string
          enum: [race, relay]
        turnSeconds:
          type: integer
          enum: [30, 60, 90, 120]
        targetWins:
          type: integer
          minimum: 1
        catalogVersion:
          type: string
          description: 本场绑定的题库版本（07 §2 快照不变量按每场对局界定）。
        matchIndex:
          type: integer
          minimum: 0
        questionScope:
          type: object
          additionalProperties: true
        scoringMode:
          type: string
          enum: [wins, points, placement]
          description: wins 仅用于 2 人 race；points 为积分累计不淘汰；placement 为当前积分淘汰。
        rosterSize:
          type: integer
          minimum: 2
          maximum: 8
        maxRounds:
          type: integer
          minimum: 1

  - type: match.rematch
    observer: all
    summary: 成员点击「再来一局」确认（等待原 roster 其他成员）。
    payload:
      type: object
      additionalProperties: false
      required: [memberId, seat]
      properties:
        memberId:
          type: string
        seat:
          type: integer
          minimum: 1
          maximum: 8

  - type: round.started
    observer: all
    summary: 每局创建（countdown 态）。首局 startsAt = 就绪 + ROUND_COUNTDOWN；后续局 = 上局 ended_at + INTERMISSION。
    payload:
      type: object
      additionalProperties: false
      required:
        [
          matchIndex,
          roundIndex,
          startsAt,
          deadline,
          maxGuesses,
          activePlayerCount,
        ]
      properties:
        matchIndex:
          type: integer
          minimum: 0
        roundIndex:
          type: integer
          minimum: 1
        startsAt:
          type: string
          format: date-time
          description: 本局可开猜时刻（倒计时结束）。
        deadline:
          type: string
          format: date-time
          description: 整局超时平局时刻。
        maxGuesses:
          type: integer
          minimum: 1
        activePlayerCount:
          type: integer
          minimum: 2
          maximum: 8
          description: 本局创建时冻结的 active roster 人数；placement race 用于积分公式。
        turnMemberId:
          type: string
          description: 接力模式首个可提交玩家的稳定成员标识；竞速模式缺省。
        turnSeat:
          type: integer
          minimum: 1
          maximum: 8
          description: 接力模式首个可提交玩家；竞速模式缺省。
        turnDeadline:
          type: string
          format: date-time
          description: 接力模式当前手截止时刻；竞速模式缺省。
        maxTurnsPerPlayer:
          type: integer
          minimum: 1
          description: 接力模式每名玩家每局轮次上限；竞速模式缺省。
        maxSkipsPerPlayer:
          type: integer
          minimum: 0
          description: 接力模式每名玩家每局空过上限；主动空过与超时空过共享，竞速模式缺省。

  - type: round.playing
    observer: all
    summary: 倒计时结束；race 的 active roster players 可并行开猜，relay 仅当前行动者可猜。
    payload:
      type: object
      additionalProperties: false
      required: [matchIndex, roundIndex]
      properties:
        matchIndex:
          type: integer
          minimum: 0
        roundIndex:
          type: integer
          minimum: 1

  - type: round.opponent.guess
    observer: opponent
    summary: |
      对手每次被接受的猜测（唯一逐观察者事件）。
      statuses 为当前匿名字段位置的状态；fieldOrder 是同一观察者看到的匿名列顺序。
      服务端秘密 HMAC 绑定
      (roundId, observerMemberId, subjectMemberId, schemaVersion) 后派生列置换；
      不含角色名/字段标签/值（08 §4.5 数据最小化）。
    payload:
      type: object
      additionalProperties: false
      required:
        [matchIndex, roundIndex, memberId, seat, rowIndex, fieldOrder, statuses]
      properties:
        matchIndex:
          type: integer
          minimum: 0
        roundIndex:
          type: integer
          minimum: 1
        memberId:
          type: string
          description: 匿名矩阵所属对手的稳定成员标识。
        seat:
          type: integer
          minimum: 1
          maximum: 8
        rowIndex:
          type: integer
          minimum: 1
          description: 该成员局内猜测序号（1 起）。
        fieldOrder:
          type: array
          minItems: 1
          maxItems: 8
          description: 该观察者看到的匿名矩阵列顺序；statuses 按此顺序排列。
          items:
            $ref: "#/definitions/GuessFieldKey"
        statuses:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/definitions/FeedbackStatus"

  - type: round.spectator.guess
    observer: spectator
    summary: 竞速模式中观战者收到的完整猜测行，包含猜测角色、字段值与反馈。
    payload:
      type: object
      additionalProperties: false
      required: [matchIndex, roundIndex, memberId, seat, rowIndex, guess]
      properties:
        matchIndex:
          type: integer
          minimum: 0
        roundIndex:
          type: integer
          minimum: 1
        memberId:
          type: string
        seat:
          type: integer
          minimum: 1
          maximum: 8
        rowIndex:
          type: integer
          minimum: 1
        guess:
          $ref: "#/definitions/GuessResult"

  - type: round.shared.guess
    observer: all
    summary: 接力模式中一次被接受的共享猜测行，携带完整反馈并推进到下一手。
    payload:
      type: object
      additionalProperties: false
      required: [matchIndex, roundIndex, row]
      properties:
        matchIndex:
          type: integer
          minimum: 0
        roundIndex:
          type: integer
          minimum: 1
        row:
          $ref: "#/definitions/RelayTurnRow"
        nextTurnMemberId:
          type: string
        nextTurnSeat:
          type: integer
          minimum: 1
          maximum: 8
        nextTurnDeadline:
          type: string
          format: date-time

  - type: round.turn.timeout
    observer: all
    summary: 接力模式中当前玩家超时空过，消耗该玩家一次轮次与空过额度；额度耗尽后再次空过则本局判负。
    payload:
      type: object
      additionalProperties: false
      required: [matchIndex, roundIndex, row]
      properties:
        matchIndex:
          type: integer
          minimum: 0
        roundIndex:
          type: integer
          minimum: 1
        row:
          $ref: "#/definitions/RelayTurnRow"
        nextTurnMemberId:
          type: string
        nextTurnSeat:
          type: integer
          minimum: 1
          maximum: 8
        nextTurnDeadline:
          type: string
          format: date-time

  - type: round.turn.pass
    observer: all
    summary: 接力模式中当前玩家主动空过，消耗该玩家一次轮次与空过额度；额度耗尽后再次空过则本局判负。
    payload:
      type: object
      additionalProperties: false
      required: [matchIndex, roundIndex, row]
      properties:
        matchIndex:
          type: integer
          minimum: 0
        roundIndex:
          type: integer
          minimum: 1
        row:
          $ref: "#/definitions/RelayTurnRow"
        nextTurnMemberId:
          type: string
        nextTurnSeat:
          type: integer
          minimum: 1
          maximum: 8
        nextTurnDeadline:
          type: string
          format: date-time

  - type: round.ended
    observer: all
    summary: 局结束（猜中/玩家用尽/超时/对局被终止）。viewerResult 为观察者视角；揭示答案与按 seat 排序的成员棋盘。
    payload:
      type: object
      additionalProperties: false
      required:
        [
          matchIndex,
          roundIndex,
          winnerMemberId,
          answer,
          boards,
          scores,
          results,
        ]
      properties:
        matchIndex:
          type: integer
          minimum: 0
        roundIndex:
          type: integer
          minimum: 1
        viewerResult:
          type: string
          enum: [win, loss, draw]
          description: 玩家观察者的自身结果；观战者可缺省。
        winnerMemberId:
          oneOf:
            - type: string
            - type: "null"
          description: 平局为 null。
        forfeitedMemberId:
          type: string
          description: 主动放弃本局的玩家 memberId；非放弃结算时缺省。
        answer:
          type: object
          additionalProperties: false
          required: [id, name, avatarUrl, workId, workTitle, workCode]
          properties:
            id:
              type: string
            name:
              type: string
            avatarUrl:
              type: string
            workId:
              type: string
            workTitle:
              type: string
            workCode:
              type: string
              description: 作品短编号；整数正作使用 THxx，无法编号时为 TH--。
        boards:
          $ref: "#/definitions/Boards"
        turns:
          type: array
          description: 接力模式共享轮次流；竞速模式缺省。
          items:
            $ref: "#/definitions/RelayTurnRow"
        scores:
          type: array
          items:
            $ref: "#/definitions/MemberScore"
        results:
          type: array
          items:
            $ref: "#/definitions/MemberResult"
        placements:
          type: array
          description: placement race 每名玩家的本局状态、完成名次和得分。
          items:
            $ref: "#/definitions/RoundPlacement"
        eliminatedMemberIds:
          type: array
          items:
            type: string
        nextStartsAt:
          type: string
          format: date-time
          description: 下一局 startsAt（= 本局 ended_at + INTERMISSION，服务端驱动倒计时；对局结束或旧事件可缺失）。

  - type: match.ended
    observer: all
    summary: 对局结束（达到 targetWins / 弃赛 / 断线判负 / 服务重启 / 局数上限）。
    payload:
      type: object
      additionalProperties: false
      required:
        [matchIndex, winnerMemberId, scores, results, reason, retentionEndsAt]
      properties:
        matchIndex:
          type: integer
          minimum: 0
        viewerResult:
          type: string
          enum: [win, loss, draw]
          description: 玩家观察者的自身结果；观战者可缺省。
        winnerMemberId:
          oneOf:
            - type: string
            - type: "null"
          description: 平局为 null。
        scores:
          type: array
          items:
            $ref: "#/definitions/MemberScore"
        results:
          type: array
          items:
            $ref: "#/definitions/MemberResult"
        ranking:
          type: array
          description: 终局总积分排行榜；rank 可共享。
          items:
            $ref: "#/definitions/MemberRanking"
        reason:
          type: string
          enum: [normal, forfeit, disconnect, server_restart, round_cap]
        retentionEndsAt:
          type: string
          format: date-time
          description: finished 房间保留到期时间；观战席据此显示倒计时。

  - type: room.closed
    observer: all
    summary: 房间关闭（终态；事件保留期后整树删除）。
    payload:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [host_left, member_left, ttl, retention]

# 服务端控制帧（非事件，无 sequence；平铺消息含 type）
control:
  - type: hello-ok
    summary: 鉴权通过并声明本次同步目标水位；不表示重放完成。
    payload:
      type: object
      additionalProperties: false
      required: [type, roomId, targetGameSequence]
      properties:
        type:
          type: string
          const: hello-ok
        roomId:
          type: string
        targetGameSequence:
          type: integer
          minimum: 0
        targetChatCursor:
          type: string
  - type: sync.complete
    summary: FIFO 中此前的重放与缓冲游戏帧已全部交付；该水位可持久化。
    payload:
      type: object
      additionalProperties: false
      required: [type, gameSequence]
      properties:
        type:
          type: string
          const: sync.complete
        gameSequence:
          type: integer
          minimum: 0
        chatCursor:
          type: string
  - type: resync.required
    summary: hello 水位无法连续恢复；客户端必须拉取权威 snapshot 后重新握手。
    payload:
      type: object
      additionalProperties: false
      required: [type, scope, reason]
      properties:
        type:
          type: string
          const: resync.required
        scope:
          type: string
          enum: [game, chat, all]
        reason:
          type: string
          enum:
            [
              negative_sequence,
              invalid_cursor,
              ahead_of_server,
              history_unavailable,
            ]
        gameSequence:
          type: integer
          minimum: 0
        oldestAvailableChatCursor:
          type: string
        targetChatCursor:
          type: string
  - type: replaced
    summary: 同成员新连接注册，或当前连接缓存的 member role/seat 已失效。
    payload:
      type: object
      additionalProperties: false
      required: [type, reason]
      properties:
        type:
          type: string
          const: replaced
        reason:
          type: string
          enum: [replaced, member_changed]

# 客户端 → 服务端消息（仅两类；均为平铺消息，无信封）
clientMessages:
  - type: hello
    summary: 首帧必发；鉴权前不收发任何房间事件。
    payload:
      type: object
      additionalProperties: false
      required: [type, token, lastGameSequence]
      properties:
        type:
          type: string
          const: hello
        token:
          type: string
          description: 游客令牌（Bearer guest:{token} 中冒号后的部分）。
        lastGameSequence:
          type: integer
          minimum: 0
          description: 本地最后经 sync.complete 确认的游戏事件序号（首连为 0）。
        lastChatCursor:
          type: string
          description: 存在时启用聊天订阅；省略表示 game-only 连接。
  - type: ack
    summary: 水位推进；服务端据此检测慢消费者。
    payload:
      type: object
      additionalProperties: false
      required: [type, gameSequence]
      properties:
        type:
          type: string
          const: ack
        gameSequence:
          type: integer
          minimum: 0

definitions:
  GuessFieldKey:
    type: string
    enum:
      [
        firstAppearance,
        releaseYear,
        species,
        abilityTags,
        affiliations,
        locations,
        roles,
        hairColors,
      ]
  FeedbackStatus:
    type: string
    enum: [exact, partial, miss, higher, lower, unknown]
  GuessResult:
    type: object
    additionalProperties: false
    required: [guessId, guessName, isCorrect, feedback]
    properties:
      guessId:
        type: string
      guessName:
        type: string
      guessAvatarUrl:
        type: string
      isCorrect:
        type: boolean
      feedback:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [field, label, status, symbol, displayValue]
          properties:
            field:
              type: string
            label:
              type: string
            status:
              $ref: "#/definitions/FeedbackStatus"
            symbol:
              type: string
            displayValue:
              type: array
              items:
                type: string
  GuessList:
    type: array
    items:
      $ref: "#/definitions/GuessResult"
  RelayTurnRow:
    type: object
    additionalProperties: false
    required: [index, memberId, seat, kind]
    properties:
      index:
        type: integer
        minimum: 1
      memberId:
        type: string
      seat:
        type: integer
        minimum: 1
        maximum: 8
      kind:
        type: string
        enum: [guess, timeout, pass]
      guess:
        $ref: "#/definitions/GuessResult"
  Boards:
    type: array
    items:
      $ref: "#/definitions/MemberBoard"
  MemberBoard:
    type: object
    additionalProperties: false
    required: [memberId, seat, guesses]
    properties:
      memberId:
        type: string
      seat:
        type: integer
        minimum: 1
        maximum: 8
      guesses:
        $ref: "#/definitions/GuessList"
  MemberScore:
    type: object
    additionalProperties: false
    required: [memberId, seat, score]
    properties:
      memberId:
        type: string
      seat:
        type: integer
        minimum: 1
        maximum: 8
      score:
        type: integer
        minimum: 0
      status:
        type: string
        enum: [active, eliminated, left]
      bestRoundScore:
        type: integer
        minimum: 0
      eliminatedRound:
        type: integer
        minimum: 1
  RoundPlacement:
    type: object
    additionalProperties: false
