# 多人单局 schema：RoundView 与猜测响应
# 对应 docs/multiplayer.md（round 快照与 guess 端点响应）

OpponentRow:
  type: object
  description: 对手一行猜测（匿名矩阵行）。局中只含状态颜色序列，不含角色名/字段标签/值。
  required:
    - index
    - statuses
  properties:
    index:
      type: integer
      description: 该成员局内猜测序号（1 起）。
    statuses:
      type: array
      description: 当前可见字段位置的状态；服务端秘密 HMAC 绑定 round、observer、subject、schemaVersion 后列置换，客户端拿不到真实列序。
      items:
        $ref: "./session.yaml#/FeedbackStatus"

RaceRoundParticipantStatus:
  type: string
  enum:
    - active
    - correct
    - forfeited
    - exhausted
    - timed_out

RoundPlacementView:
  type: object
  required:
    - memberId
    - seat
    - status
    - pointsAwarded
  properties:
    memberId:
      type: string
    seat:
      type: integer
      minimum: 1
      maximum: 8
    status:
      $ref: "#/RaceRoundParticipantStatus"
    finishRank:
      type: integer
      minimum: 1
    pointsAwarded:
      type: integer
      minimum: 0

RelayTurnRow:
  type: object
  description: 接力模式共享棋盘中的一行。guess 行包含完整反馈；timeout/pass 行分别表示超时空过/主动空过。
  required:
    - index
    - memberId
    - seat
    - kind
  properties:
    index:
      type: integer
      minimum: 1
      description: 本局共享轮次序号（1 起）。
    memberId:
      type: string
      description: 本轮归属玩家的稳定成员标识。
    seat:
      type: integer
      minimum: 1
      maximum: 8
      description: 本轮发生时的展示席位。
    kind:
      type: string
      enum:
        - guess
        - timeout
        - pass
    guess:
      $ref: "./session.yaml#/GuessResult"

MemberBoardView:
  type: object
  required:
    - memberId
    - seat
    - guesses
  properties:
    memberId:
      type: string
    seat:
      type: integer
      minimum: 1
      maximum: 8
    guesses:
      type: array
      items:
        $ref: "./session.yaml#/GuessResult"

OpponentBoardView:
  type: object
  required:
    - memberId
    - seat
    - rows
  properties:
    memberId:
      type: string
    seat:
      type: integer
      minimum: 1
      maximum: 8
    rows:
      type: array
      items:
        $ref: "#/OpponentRow"

RoundView:
  type: object
  description: |
    逐观察者投影的单局视图：self 为完整棋盘（同单人，含角色名/标签/值），
    opponents 为按 seat 排序的匿名矩阵集合（只含状态颜色序列）。观战者会额外收到 boards 完整棋盘集合。
    接力模式额外提供 shared.rows、turnMemberId、turnSeat、turnDeadline、maxTurnsPerPlayer 与 maxSkipsPerPlayer。
  required:
    - status
    - startsAt
    - deadline
    - maxGuesses
    - self
    - opponents
  properties:
    status:
      $ref: "./multi-common.yaml#/RoundStatus"
    startsAt:
      type: string
      format: date-time
      description: 本局可开猜时刻（倒计时结束；局间间歇兼作倒计时）。
    deadline:
      type: string
      format: date-time
      description: 整局截止时刻；race 默认 startsAt + 5min，relay 默认 startsAt + 15min。
    maxGuesses:
      type: integer
      minimum: 1
      description: 每局每人猜测上限；由本场题库设置决定，无次数限制时为 999。
    self:
      type: object
      description: 自己的完整棋盘（角色名/头像/每字段标签、状态、符号、展示值）。
      required:
        - guesses
      properties:
        memberId:
          type: string
          description: 玩家视角为本人 memberId；观战者缺省。
        seat:
          type: integer
          minimum: 1
          maximum: 8
          description: 玩家视角为本人 seat；观战者缺省。
        participationStatus:
          $ref: "#/RaceRoundParticipantStatus"
        finishRank:
          type: integer
          minimum: 1
        guesses:
          type: array
          items:
            $ref: "./session.yaml#/GuessResult"
    opponents:
      type: array
      description: 对手匿名矩阵集合；按 seat 稳定排序并以 memberId 关联。
      items:
        $ref: "#/OpponentBoardView"
    boards:
      type: array
      description: 观战者当前局完整棋盘集合；玩家视角缺省，避免泄露对手猜测明细。
      items:
        $ref: "#/MemberBoardView"
    shared:
      type: object
      description: 接力模式共享棋盘；竞速模式为空或缺省。
      required:
        - rows
      properties:
        rows:
          type: array
          items:
            $ref: "#/RelayTurnRow"
    turnMemberId:
      type: string
      description: 接力模式当前可提交玩家的稳定成员标识。
    turnSeat:
      type: integer
      minimum: 1
      maximum: 8
      description: 接力模式当前可提交玩家的展示席位。
    turnDeadline:
      type: string
      format: date-time
      description: 接力模式当前玩家本轮截止时刻。
    maxTurnsPerPlayer:
      type: integer
      minimum: 1
      description: 接力模式每名玩家每局的轮次上限（猜测与超时空过均计入）。
    maxSkipsPerPlayer:
      type: integer
      minimum: 0
      description: 接力模式每名玩家每局可空过次数上限（主动空过与超时空过共享）。

GuessResponse:
  type: object
  description: 猜测被接受的自视角响应（完整反馈；局中不返回答案与对手信息）。
  required:
    - roundIndex
    - guess
  properties:
    roundIndex:
      type: integer
      minimum: 1
    guess:
      $ref: "./session.yaml#/GuessResult"
    participationStatus:
      $ref: "#/RaceRoundParticipantStatus"
    finishRank:
      type: integer
      minimum: 1
