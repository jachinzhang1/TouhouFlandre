# GET /api/catalog/full — 当前全量题库快照（题库设置与校验使用）
get:
  operationId: catalog_full
  summary: 获取当前全量题库快照
  tags:
    - catalog
  responses:
    "200":
      description: 当前全量题库快照与默认题库配置。
      content:
        application/json:
          schema:
            $ref: "../schemas/question-scope.yaml#/CatalogFull"
    "503":
      description: 题库未初始化
      content:
        application/json:
          schema:
            $ref: "../schemas/common.yaml#/ErrorResponse"
