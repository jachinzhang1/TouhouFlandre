        type: integer
        minimum: 1
  MemberResult:
    type: object
    additionalProperties: false
    required: [memberId, seat, result]
    properties:
      memberId:
        type: string
      seat:
        type: integer
        minimum: 1
        maximum: 8
      result:
        type: string
        enum: [win, loss, draw]

