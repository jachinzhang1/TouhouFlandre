version: "3"

tasks:
  dev:
    deps: [db:up]
    cmds:
      - task --parallel dev:api dev:web

  dev:api:
    dir: apps/api
    cmds:
      - bash -c 'set -a && . ../../.env && set +a && go run ./cmd/server'

  dev:web:
    cmds:
      - pnpm --filter @touhouflandre/web dev

  db:up:
    cmds:
      - docker compose -f compose-dev.yaml up -d --wait postgres
      - task: db:wait

  db:wait:
    cmds:
      - node scripts/wait-for-db-port.mjs

  db:down:
    cmds:
      - docker compose -f compose-dev.yaml down

  db:migrate:
    dir: apps/api
    cmds:
      - bash -c 'set -a && . ../../.env && set +a && go tool goose -dir migrations up'

  db:seed:
    deps: [catalog:check]
    cmds:
      - task: db:seed:go

  db:seed:go:
    dir: apps/api
    cmds:
      - bash -c 'set -a && . ../../.env && set +a && go run ./cmd/seed'

  catalog:check:
    cmds:
      - pnpm --filter @touhouflandre/data validate

  gen:openapi:
    dir: apps/api
    cmds:
      - pnpm exec redocly bundle ../../contracts/openapi/openapi.yaml -o .openapi.bundled.yaml
      # oapi-codegen 版本固定于 go.mod tool 指令（go tool；随 Go 模块缓存复用，CI 免重复下载）
      - go tool oapi-codegen -config oapi-codegen.yaml .openapi.bundled.yaml

  gen:repo:
    dir: apps/api
    cmds:
      - sqlc generate

  gen:web:
    cmds:
      - pnpm --filter @touhouflandre/web gen:api

  gen:
    cmds:
      - task: gen:openapi
      - task: gen:repo
      - task: gen:web

  check:generated:
    cmds:
      - task: gen
      - git diff --exit-code -- apps/api/internal/generated

  check:ws-protocol:
    cmds:
      - pnpm check:ws-protocol

  test:go:
    dir: apps/api
    cmds:
      - go test ./...

  dev:go:
    dir: apps/api
    cmds:
      - go run ./cmd/server

  prod:build:
    cmds:
      - docker compose build

  prod:up:
    cmds:
      - docker compose up -d --build --wait

  prod:down:
    cmds:
      - docker compose down

  prod:logs:
    cmds:
      - docker compose logs -f
