name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一 PR/分支连续 push 时取消旧运行（省额度）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: OpenAPI lint
        run: pnpm lint:openapi

      - name: OpenAPI refs & orphan check
        run: pnpm check:openapi-refs

      - name: WS protocol schema & examples check
        run: pnpm check:ws-protocol

      - name: Generated types are up to date
        run: |
          pnpm --filter @touhouflandre/web gen:api
          git diff --exit-code -- apps/web/src/generated

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: touhouflandre
          POSTGRES_USER: touhouflandre
          POSTGRES_PASSWORD: touhouflandre-ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U touhouflandre -d touhouflandre"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: apps/api/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: arduino/setup-task@v2

      - uses: sqlc-dev/setup-sqlc@v2
        with:
          sqlc-version: "1.31.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Multiplayer package boundaries
        run: pnpm check:multiplayer-boundaries

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Go vet & build
        working-directory: apps/api
        run: go vet ./... && go build ./...

      - name: Wait for Postgres
        env:
          PGPASSWORD: touhouflandre-ci
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5433 -U touhouflandre -d touhouflandre; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres ($attempt/30)"
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Go test (integration, real Postgres)
        working-directory: apps/api
        env:
          DATABASE_URL_PG: postgres://touhouflandre:touhouflandre-ci@127.0.0.1:5433/touhouflandre?sslmode=disable
        run: go test ./...

      - name: Generated Go and Web code is up to date
        env:
          DATABASE_URL_PG: postgres://touhouflandre:touhouflandre-ci@127.0.0.1:5433/touhouflandre?sslmode=disable
        run: task check:generated
