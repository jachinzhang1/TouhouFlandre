openapi: 3.0.3
info:
  title: TouhouFlandre API
  version: 1.0.0
  description: |
    东方芙一把（TouhouFlandre）API 契约。多文件拆分，本文件是唯一入口，
    所有生成器只读取本文件；paths 与 schemas 通过本地 $ref 引用。
  license:
    name: MIT
    url: https://github.com/TouhouFlandre/touhouflandre/blob/main/LICENSE
servers:
  - url: /
security: []
tags:
  - name: health
    description: 服务健康检查
  - name: characters
    description: 角色搜索
  - name: catalog
    description: 题库摘要
  - name: puzzles
    description: 题局创建
  - name: sessions
    description: 会话与猜测
  - name: rooms
    description: 多人房间（创建/加入/就绪/猜测/对局/再来一局）
  - name: site
    description: 站点级信息与统计
paths:
  /api/health:
    $ref: ./paths/health.yaml
  /api/site/visits:
    $ref: ./paths/site-visits.yaml
  /api/characters/search:
    $ref: ./paths/characters.yaml
  /api/catalog:
    $ref: ./paths/catalog.yaml
  /api/catalog/full:
    $ref: ./paths/catalog-full.yaml
  /api/catalog/characters:
    $ref: ./paths/catalog-characters.yaml
  /api/puzzles/{mode}:
    $ref: ./paths/puzzles.yaml
  /api/sessions/{sessionId}/guess:
    $ref: ./paths/sessions-guess.yaml
  /api/sessions/{sessionId}/timeout:
    $ref: ./paths/sessions-timeout.yaml
  /api/sessions/{sessionId}/forfeit:
    $ref: ./paths/sessions-forfeit.yaml
  /api/sessions/{sessionId}:
    $ref: ./paths/sessions.yaml
  /api/rooms:
    $ref: ./paths/rooms.yaml
  /api/rooms/{roomCode}:
    $ref: ./paths/room-info.yaml
  /api/rooms/{roomCode}/join:
    $ref: ./paths/room-join.yaml
  /api/rooms/{roomId}/snapshot:
    $ref: ./paths/room-snapshot.yaml
  /api/rooms/{roomId}/ready:
    $ref: ./paths/room-ready.yaml
  /api/rooms/{roomId}/settings:
    $ref: ./paths/room-settings.yaml
  /api/rooms/{roomId}/claim-seat:
    $ref: ./paths/room-claim-seat.yaml
  /api/rooms/{roomId}/rematch:
    $ref: ./paths/room-rematch.yaml
  /api/rooms/{roomId}/leave:
    $ref: ./paths/room-leave.yaml
  /api/rooms/{roomId}:
    $ref: ./paths/room-close.yaml
  /api/rooms/{roomId}/ws:
    $ref: ./paths/room-ws.yaml
  /api/rooms/{roomId}/messages:
    $ref: ./paths/room-messages.yaml
  /api/rooms/{roomId}/rounds/{roundIndex}/guess:
    $ref: ./paths/room-rounds.yaml
  /api/rooms/{roomId}/rounds/{roundIndex}/forfeit:
    $ref: ./paths/room-round-forfeit.yaml
  /api/rooms/{roomId}/rounds/{roundIndex}/pass:
    $ref: ./paths/room-round-pass.yaml
  /api/rooms/{roomId}/stages/{stageIndex}/encounters/{encounterId}/actions:
    $ref: ./paths/room-relay-encounter-action.yaml
  /api/rooms/{roomId}/matches/{matchIndex}/stages:
    $ref: ./paths/room-relay-history.yaml
components:
  schemas:
    ErrorResponse:
      $ref: ./schemas/common.yaml#/ErrorResponse
    SiteVisitResponse:
      $ref: ./schemas/site.yaml#/SiteVisitResponse
    HairColor:
      $ref: ./schemas/character.yaml#/HairColor
    DifficultyTier:
      $ref: ./schemas/character.yaml#/DifficultyTier
    Era:
      $ref: ./schemas/character.yaml#/Era
    LocalizedNames:
      $ref: ./schemas/character.yaml#/LocalizedNames
    FirstAppearance:
      $ref: ./schemas/character.yaml#/FirstAppearance
    Character:
      $ref: ./schemas/character.yaml#/Character
    CharacterSearchResult:
      $ref: ./schemas/character.yaml#/CharacterSearchResult
    CharacterSearchResponse:
      $ref: ./schemas/character.yaml#/CharacterSearchResponse
    CatalogContentSummary:
      $ref: ./schemas/character.yaml#/CatalogContentSummary
    CatalogSummary:
      $ref: ./schemas/character.yaml#/CatalogSummary
    QuestionDifficultyPreset:
      $ref: ./schemas/question-scope.yaml#/QuestionDifficultyPreset
    QuestionDifficulty:
      $ref: ./schemas/question-scope.yaml#/QuestionDifficulty
    QuestionScopeMode:
      $ref: ./schemas/question-scope.yaml#/QuestionScopeMode
    QuestionScopeWorkSelection:
      $ref: ./schemas/question-scope.yaml#/QuestionScopeWorkSelection
    QuestionScopeReleaseYearMode:
      $ref: ./schemas/question-scope.yaml#/QuestionScopeReleaseYearMode
    QuestionScopeFieldRules:
      $ref: ./schemas/question-scope.yaml#/QuestionScopeFieldRules
    QuestionScopeTurnLimit:
      $ref: ./schemas/question-scope.yaml#/QuestionScopeTurnLimit
    QuestionScopeGuessLimit:
      $ref: ./schemas/question-scope.yaml#/QuestionScopeGuessLimit
    QuestionScopeRules:
      $ref: ./schemas/question-scope.yaml#/QuestionScopeRules
    QuestionScopeWorkState:
      $ref: ./schemas/question-scope.yaml#/QuestionScopeWorkState
    QuestionScopeConfig:
      $ref: ./schemas/question-scope.yaml#/QuestionScopeConfig
    CatalogFull:
      $ref: ./schemas/question-scope.yaml#/CatalogFull
    PuzzleCreateRequest:
      $ref: ./schemas/question-scope.yaml#/PuzzleCreateRequest
    WorkType:
      $ref: ./schemas/work.yaml#/WorkType
    Work:
      $ref: ./schemas/work.yaml#/Work
    FeedbackStatus:
      $ref: ./schemas/session.yaml#/FeedbackStatus
    SessionStatus:
      $ref: ./schemas/session.yaml#/SessionStatus
    GameMode:
      $ref: ./schemas/session.yaml#/GameMode
    GameContentType:
      $ref: ./schemas/session.yaml#/GameContentType
    FeedbackSymbol:
      $ref: ./schemas/session.yaml#/FeedbackSymbol
    FieldFeedback:
      $ref: ./schemas/session.yaml#/FieldFeedback
    GuessResult:
      $ref: ./schemas/session.yaml#/GuessResult
