# POST /api/rooms/{roomId}/claim-seat — 观战者认领大厅空席位
post:
  operationId: rooms_claimSeat
  tags:
    - rooms
  summary: 认领玩家席位
  description: |
    connected spectator 可在 lobby 明确认领空席位。服务端在房间行锁下复用原 memberId/token，
    分配最小可用 seat，并转换为 ready=false 的 player；不会自动提升其他 spectator。
  parameters:
    - name: roomId
      in: path
      required: true
      schema:
        type: string
  responses:
    "204":
      description: 已认领席位；客户端应使用同一 token 重新连接以取得 player 视图
    "401":
      description: 令牌无效或成员未连接（GUEST_UNAUTHORIZED）
      content:
        application/json:
          schema:
            $ref: "../schemas/common.yaml#/ErrorResponse"
    "403":
      description: 当前成员不是 spectator（SPECTATOR_READ_ONLY）
      content:
        application/json:
          schema:
            $ref: "../schemas/common.yaml#/ErrorResponse"
    "404":
      description: 房间不存在（ROOM_NOT_FOUND）
      content:
        application/json:
          schema:
            $ref: "../schemas/common.yaml#/ErrorResponse"
    "409":
      description: 房间已满（ROOM_FULL）或对局已开始（MATCH_ALREADY_STARTED）
      content:
        application/json:
          schema:
            $ref: "../schemas/common.yaml#/ErrorResponse"
