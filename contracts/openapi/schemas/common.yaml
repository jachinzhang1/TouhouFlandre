# 通用 schema：错误模型与跨领域约定
ErrorResponse:
  type: object
  description: 统一错误结构。code 为稳定错误码，error 为人类可读消息（旧客户端仅读取该字段）。
  required:
    - code
    - error
  properties:
    code:
      type: string
      enum:
        - INVALID_REQUEST
        - INVALID_GUESS
        - SESSION_NOT_FOUND
        - SESSION_CLOSED
        - DUPLICATE_GUESS
        - CONCURRENT_UPDATE
        - UNSUPPORTED_CONTENT_TYPE
        - CATALOG_NOT_READY
        - CATALOG_VERSION_NOT_FOUND
        - INTERNAL
        # 多人模式（08 §7.2）
        - ROOM_NOT_FOUND
        - ROOM_FULL
        - ROOM_CLOSED
        - GUEST_UNAUTHORIZED
        - SPECTATOR_READ_ONLY
        - INVALID_FORMAT
        - INVALID_PLAYER_LIMIT
        - ROOM_SETTINGS_LOCKED
        - MATCH_ALREADY_STARTED
        - REMATCH_NOT_AVAILABLE
        - ROUND_NOT_ACTIVE
        - ROUND_ENDED
        - NOT_YOUR_TURN
        - TURN_EXPIRED
        - GUESS_LIMIT_REACHED
        # 加入/预检按 IP 速率限制（08 §8.5）
        - RATE_LIMITED
        # MPX-008 房间聊天
        - CHAT_MESSAGE_INVALID
        - CHAT_CURSOR_INVALID
        - CHAT_SEND_FORBIDDEN
        - CHAT_IDEMPOTENCY_CONFLICT
        - CHAT_CURSOR_AHEAD
        - CHAT_RESYNC_REQUIRED
    error:
      type: string
