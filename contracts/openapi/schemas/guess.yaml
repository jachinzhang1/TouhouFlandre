# 猜测字段 schema：GuessFieldKey 与 GuessField
# 对应 packages/shared/src/types.ts

GuessFieldKey:
  type: string
  description: 服务端字段注册表提供的稳定字段 key。

GuessField:
  type: object
  required:
    - key
    - label
    - type
    - visible
    - compareStrategy
  properties:
    key:
      $ref: "#/GuessFieldKey"
    label:
      type: string
    type:
      type: string
      enum:
        - string
        - enum
        - multi_enum
        - number
        - hierarchy
    visible:
      type: boolean
    compareStrategy:
      type: string
      description: 服务端字段注册表提供的反馈比较策略标识。
    helpText:
      type: string

GuessFieldModeDefinition:
  type: object
  required:
    - key
    - label
    - enabled
  properties:
    key:
      type: string
    label:
      type: string
    enabled:
      type: boolean

GuessFieldDefinition:
  type: object
  description: 服务端字段注册表中的可配置公开词条定义；比较和规范化语义由服务端持有。
  required:
    - key
    - label
    - type
    - configurable
    - defaultMode
    - modes
    - equivalence
  properties:
    key:
      $ref: "#/GuessFieldKey"
    label:
      type: string
    type:
      type: string
      enum:
        - string
        - enum
        - multi_enum
        - number
        - hierarchy
    helpText:
      type: string
    configurable:
      type: boolean
    defaultMode:
      type: string
    modes:
      type: array
      items:
        $ref: "#/GuessFieldModeDefinition"
    equivalence:
      type: boolean
