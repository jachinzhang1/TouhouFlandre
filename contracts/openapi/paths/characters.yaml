# GET /api/characters/search
get:
  operationId: characters_search
  tags:
    - characters
  summary: 搜索角色
  parameters:
    - name: q
      in: query
      required: false
      description: 原始用户查询词（可为空）；服务端统一归一化并按单个搜索字段匹配。
      schema:
        type: string
    - name: sessionId
      in: query
      required: false
      description: 单人游戏会话 id；提供后按该会话冻结的题库版本和题库范围搜索。
      schema:
        type: string
    - name: catalogVersion
      in: query
      required: false
      description: 题库版本；仅绑定版本快照，不应用游戏题库范围。与游戏上下文参数互斥。
      schema:
        type: string
    - name: roomId
      in: query
      required: false
      description: 多人房间 id；必须与 matchIndex 同时提供，并按该场冻结的题库版本和题库范围搜索。
      schema:
        type: string
    - name: matchIndex
      in: query
      required: false
      description: 多人场次序号；必须与 roomId 同时提供。
      schema:
        type: integer
        minimum: 0
        maximum: 2147483647
    - name: workIds
      in: query
      required: false
      description: 逗号分隔的作品 id 列表；仅用于收窄搜索结果。
      schema:
        type: string
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 250
    - name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
    - name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - name
          - appearance
    - name: direction
      in: query
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
  responses:
    "200":
      description: 搜索结果
      content:
        application/json:
          schema:
            $ref: "../schemas/character.yaml#/CharacterSearchResponse"
    "400":
      description: 请求参数不合法
      content:
        application/json:
          schema:
            $ref: "../schemas/common.yaml#/ErrorResponse"
    "404":
      description: 游戏会话、多人场次或题库版本不存在
      content:
        application/json:
          schema:
            $ref: "../schemas/common.yaml#/ErrorResponse"
    "503":
      description: 题库未初始化
      content:
        application/json:
          schema:
            $ref: "../schemas/common.yaml#/ErrorResponse"
