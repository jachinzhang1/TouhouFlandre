name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: OpenAPI lint and references
        run: pnpm lint:openapi && pnpm check:openapi-refs
      - name: WebSocket protocol and architecture boundaries
        run: pnpm check:ws-protocol && pnpm check:multiplayer-boundaries
      - name: Generated Web types are up to date
        run: |
          pnpm --filter @touhouflandre/web gen:api
          git diff --exit-code -- apps/web/src/generated
      - name: Typecheck
        run: pnpm typecheck
      - name: Frontend and shared tests
        run: pnpm test

  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: rust_test
          POSTGRES_PASSWORD: rust_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rust_test -d postgres"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generated Rust contracts are up to date
        run: pnpm check:rust-contracts
      - name: Install pinned SQLx CLI
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres,rustls
      - name: SQLx metadata matches a fresh migrated schema
        env:
          TEST_DATABASE_URL: postgres://rust_test:rust_test@127.0.0.1:5433/postgres
        run: node scripts/sqlx-prepare.mjs --check
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Standalone guessing core without optional features
        run: cargo test -p touhouflandre-core --no-default-features --locked
      - name: Rust tests including isolated PostgreSQL integration
        env:
          TEST_DATABASE_URL: postgres://rust_test:rust_test@127.0.0.1:5433/postgres
        run: cargo test --workspace --locked -- --include-ignored
      - name: Release binaries
        run: cargo build --workspace --release --locked --bins
