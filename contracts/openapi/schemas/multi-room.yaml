# 多人房间 schema：MemberView / RoomInfo / 创建加入响应 / RoomSnapshot
# 对应 docs/multiplayer.md（端点响应与快照形状）

MemberView:
  type: object
  description: 房间成员视图。
  required:
    - memberId
    - seat
    - displayName
    - status
    - ready
  properties:
    memberId:
      type: string
      description: 房间内稳定、可公开的成员标识；不是鉴权凭据。
    seat:
      type: integer
      minimum: 1
      maximum: 8
      description: 房间内展示顺序；seat 1 为房主，但身份关联使用 memberId。
    displayName:
      type: string
      description: 昵称（纯展示，≤16 字符；空则服务端给「匿名玩家」）。
    status:
      $ref: "./multi-common.yaml#/MemberStatus"
    ready:
      type: boolean
      description: 大厅就绪态（仅 lobby 态使用）。

ParticipantView:
  type: object
  description: 当前访问者视图。观战者不占玩家 seat。
  required:
    - memberId
    - role
    - displayName
    - status
  properties:
    memberId:
      type: string
      description: 当前访问者在房间内的稳定成员标识。
    role:
      $ref: "./multi-common.yaml#/ParticipantRole"
    seat:
      type: integer
      minimum: 1
      maximum: 8
      description: 玩家席位；观战者缺省。
    displayName:
      type: string
    status:
      $ref: "./multi-common.yaml#/MemberStatus"

RoomInfo:
  type: object
  description: 公开只读预检（加入前可见赛制，08 §4.2）。不含成员名/token。
  required:
    - roomCode
    - format
    - mode
    - turnSeconds
    - status
    - memberCount
    - spectatorCount
    - joinRole
    - playerLimit
  properties:
    roomCode:
      type: string
      description: 6 位房间号。
    format:
      $ref: "./multi-common.yaml#/RoomFormat"
    mode:
      $ref: "./multi-common.yaml#/MultiplayerMode"
    turnSeconds:
      type: integer
      enum: [30, 60, 90, 120]
      description: 接力模式单用户猜测时限（秒）。竞速模式固定返回 60 以保持形状稳定。
    status:
      $ref: "./multi-common.yaml#/RoomStatus"
    memberCount:
      type: integer
      minimum: 0
      maximum: 8
      description: 当前 PK 玩家数（不含观战者）。
    spectatorCount:
      type: integer
      minimum: 0
      description: 当前未离开的观战者数量。
    joinRole:
      $ref: "./multi-common.yaml#/ParticipantRole"
    playerLimit:
      type: integer
      minimum: 2
      maximum: 8
      description: 允许同时入座的最大玩家数；不表示开局必须凑满。
    questionScope:
      $ref: "./question-scope.yaml#/QuestionScopeConfig"

CreateRoomResponse:
  type: object
  description: 创建房间响应。guestToken 明文仅此一次返回。
  required:
    - roomId
    - roomCode
    - guestToken
    - viewer
  properties:
    roomId:
      type: string
    roomCode:
      type: string
    guestToken:
      $ref: "./multi-common.yaml#/GuestToken"
    viewer:
      $ref: "#/ParticipantView"
    questionScope:
      $ref: "./question-scope.yaml#/QuestionScopeConfig"

JoinRoomResponse:
  type: object
  description: 加入房间响应。guestToken 明文仅此一次返回。
  required:
    - roomId
    - guestToken
    - joinRole
    - viewer
  properties:
    roomId:
      type: string
    guestToken:
      $ref: "./multi-common.yaml#/GuestToken"
    joinRole:
      $ref: "./multi-common.yaml#/ParticipantRole"
      description: 此次加入实际获得的角色；满 playerLimit 后明确为 spectator。
    viewer:
      $ref: "#/ParticipantView"

RoomSnapshot:
  type: object
  description: |
    逐观察者投影的房间权威快照：self（完整棋盘）、opponents（匿名矩阵 + 对方列置换）。
    gameSequence 是快照捕获的权威游戏水位；events 为 after 游标之后可见的业务事件投影，
    被隐藏的 sequence 可由客户端直接对齐到 gameSequence。match 仅在已有场次时存在，
    round 仅在局处于 countdown/playing 时存在。
  required:
    - roomId
    - roomCode
    - format
    - mode
    - turnSeconds
    - status
    - expiresAt
    - viewer
    - members
    - spectatorCount
    - playerLimit
    - gameSequence
    - events
  properties:
    roomId:
      type: string
    roomCode:
      type: string
    format:
      $ref: "./multi-common.yaml#/RoomFormat"
    mode:
      $ref: "./multi-common.yaml#/MultiplayerMode"
    turnSeconds:
      type: integer
      enum: [30, 60, 90, 120]
    status:
      $ref: "./multi-common.yaml#/RoomStatus"
    expiresAt:
      type: string
      format: date-time
      description: 当前房间状态的到期时间；finished 态用于观战席保留倒计时。
    questionScope:
      $ref: "./question-scope.yaml#/QuestionScopeConfig"
    viewer:
      $ref: "#/ParticipantView"
    members:
      type: array
      description: PK 玩家视图，不含观战者。
      items:
        $ref: "#/MemberView"
    spectatorCount:
      type: integer
      minimum: 0
    playerLimit:
      type: integer
      minimum: 2
      maximum: 8
      description: 允许同时入座的最大玩家数；不表示开局必须凑满。
    gameSequence:
      type: integer
      minimum: 0
      description: 此快照捕获的 room_event 权威高水位；用于 v2 缺口补齐后重置 appliedGameSequence。
    match:
      type: object
      description: 当前场次（lobby 态不存在；含 finished 等待再来一局）。
      allOf:
        - $ref: "./multi-match.yaml#/MatchView"
    round:
      type: object
      description: 当前局（仅 countdown/playing 态存在；投影语义见 multi-round.yaml）。
      allOf:
        - $ref: "./multi-round.yaml#/RoundView"
    events:
      type: array
      description: after 游标之后的事件（逐观察者投影后）。
      items:
        $ref: "./multi-common.yaml#/RoomEventEnvelope"
