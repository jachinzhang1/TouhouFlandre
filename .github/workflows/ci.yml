name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: OpenAPI lint
        run: pnpm lint:openapi

      - name: OpenAPI refs & orphan check
        run: pnpm check:openapi-refs

      - name: Generated types are up to date
        run: |
          pnpm --filter @touhoufriberg/web gen:api
          git diff --exit-code -- apps/web/src/generated

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
