[package]
name = "touhouflandre-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Pure character guessing rules and attempt transitions"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
