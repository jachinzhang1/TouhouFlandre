# 多人场次 schema：MatchView
# 对应 docs/08_multiplayer_mode_design.md §7.3 快照形状中的 match 段

MatchView:
  type: object
  description: 场次视图。场次自包含：比分、题库版本绑定（catalogVersion 见事件）、round_count 归场行。
  required:
    - matchIndex
    - targetWins
    - scoreSlot1
    - scoreSlot2
    - roundIndex
    - maxRounds
    - rematchReady
  properties:
    matchIndex:
      type: integer
      minimum: 0
      description: 场次序号；0 = 首场，1 = 第一次再来一局……
    targetWins:
      type: integer
      minimum: 1
      description: 目标胜场 = (N+1)/2。
    scoreSlot1:
      type: integer
      minimum: 0
      description: slot 1 已胜局数（平局不计入）。
    scoreSlot2:
      type: integer
      minimum: 0
      description: slot 2 已胜局数（平局不计入）。
    roundIndex:
      type: integer
      minimum: 0
      description: 当前局号（0 = 本场尚未开局；对局中为当前局序号，1 起）。
    maxRounds:
      type: integer
      description: 总局数安全上限 = 3 × N（bo1→3、bo3→9、bo5→15、bo7→21）。
    rematchReady:
      type: array
      description: 再来一局确认态，索引 0/1 对应 slot 1/2（仅 finished 态有意义）。
      items:
        type: boolean
      minItems: 2
      maxItems: 2
