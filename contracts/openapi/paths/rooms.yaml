# POST /api/rooms — 创建房间（房主入座 slot 1）
# 对应 docs/multiplayer.md
post:
  operationId: rooms_create
  tags:
    - rooms
  summary: 创建房间
  description: 无鉴权。校验赛制，生成 6 位房间号（32 字符集，冲突重试），签发游客令牌。
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - format
          properties:
            format:
              $ref: "../schemas/multi-common.yaml#/RoomFormat"
            mode:
              $ref: "../schemas/multi-common.yaml#/MultiplayerMode"
              description: 可选玩法模式；缺省为 race（竞速）。
            playerLimit:
              type: integer
              minimum: 2
              maximum: 8
              default: 2
              description: race 上限为 2..8；relay 上限只接受 2/4/6/8；缺省为 2。
            raceEliminationEnabled:
              type: boolean
              default: false
              description: race 3 人及以上时是否启用积分淘汰；2 人对局始终按双人 BO。
            relayEliminationEnabled:
              type: boolean
              default: false
              description: relay 4/6/8 人时是否启用淘汰；2 人对局始终按传统双人接力。
            turnSeconds:
              type: integer
              enum: [30, 60, 90, 120]
              default: 60
              description: 接力模式单用户猜测时限（秒）。竞速模式忽略该值。
            displayName:
              type: string
              description: 可选昵称：trim + 去控制字符 + ≤16 字符；空则服务端给「匿名玩家」。
            questionScope:
              $ref: "../schemas/question-scope.yaml#/QuestionScopeConfig"
  responses:
    "201":
      description: 房间已创建（含房间号与一次性游客令牌）
      content:
        application/json:
          schema:
            $ref: "../schemas/multi-room.yaml#/CreateRoomResponse"
    "400":
      description: 非法赛制（INVALID_FORMAT）或玩家上限（INVALID_PLAYER_LIMIT）
      content:
        application/json:
          schema:
            $ref: "../schemas/common.yaml#/ErrorResponse"
    "500":
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: "../schemas/common.yaml#/ErrorResponse"
