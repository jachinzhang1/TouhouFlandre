      $ref: ./schemas/guess.yaml#/GuessField
    RoomFormat:
      $ref: ./schemas/multi-common.yaml#/RoomFormat
    MultiplayerMode:
      $ref: ./schemas/multi-common.yaml#/MultiplayerMode
    RoomStatus:
      $ref: ./schemas/multi-common.yaml#/RoomStatus
    MemberStatus:
      $ref: ./schemas/multi-common.yaml#/MemberStatus
    ParticipantRole:
      $ref: ./schemas/multi-common.yaml#/ParticipantRole
    RoundStatus:
      $ref: ./schemas/multi-common.yaml#/RoundStatus
    MatchResult:
      $ref: ./schemas/multi-common.yaml#/MatchResult
    MatchEndReason:
      $ref: ./schemas/multi-common.yaml#/MatchEndReason
    RoomCloseReason:
      $ref: ./schemas/multi-common.yaml#/RoomCloseReason
    GuestToken:
      $ref: ./schemas/multi-common.yaml#/GuestToken
    RoomEventEnvelope:
      $ref: ./schemas/multi-common.yaml#/RoomEventEnvelope
    MemberView:
      $ref: ./schemas/multi-room.yaml#/MemberView
