# POST /api/rooms/{roomCode}/join — 加入房间（分配 player seat 或 spectator）
# 对应 docs/multiplayer.md
post:
  operationId: rooms_join
  tags:
    - rooms
  summary: 加入房间
  description: |
    无鉴权。lobby 在 playerLimit 内分配最小可用 player seat；满员或对局已开始后以 spectator 加入。
    spectatorCap 固定为 32，达到上限后返回 ROOM_FULL 且不创建 member。
    房间号输入归一化（去空格/连字符、转大写）。与公开预检共用按 IP 速率限制。
  parameters:
    - name: roomCode
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            displayName:
              type: string
              description: 可选昵称：trim + 去控制字符 + ≤16 字符；空则服务端给「匿名玩家」。
  responses:
    "201":
      description: 已加入（返回一次性游客令牌）
      content:
        application/json:
          schema:
            $ref: "../schemas/multi-room.yaml#/JoinRoomResponse"
    "404":
      description: 房间不存在/已关闭/已过期（ROOM_NOT_FOUND）
      content:
        application/json:
          schema:
            $ref: "../schemas/common.yaml#/ErrorResponse"
    "409":
      description: spectatorCap 已满（ROOM_FULL）或状态不允许加入（ROOM_CLOSED）
      content:
        application/json:
          schema:
            $ref: "../schemas/common.yaml#/ErrorResponse"
    "429":
      description: 触发按 IP 速率限制（RATE_LIMITED）
      content:
        application/json:
          schema:
            $ref: "../schemas/common.yaml#/ErrorResponse"
