services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: touhouflandre
      POSTGRES_USER: touhouflandre
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U touhouflandre -d touhouflandre"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
