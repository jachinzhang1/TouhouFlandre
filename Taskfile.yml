version: "3"

tasks:
  dev:
    desc: Run the API and Web natively, with only Postgres in Docker
    deps: [db:up]
    cmds:
      - task --parallel dev:api dev:web

  dev:api:
    dir: apps/api
    cmds:
      - bash -c 'set -a && . ../../.env && set +a && cargo run --bin server'

  dev:web:
    cmds:
      - pnpm --filter @touhouflandre/web dev

  db:up:
    cmds:
      - docker compose -f compose-dev.yaml up -d --wait postgres
      - task: db:wait

  db:wait:
    cmds:
      - node scripts/wait-for-db-port.mjs

  db:down:
    cmds:
      - docker compose -f compose-dev.yaml down

  db:migrate:
    desc: Apply SQLx migrations (refuses an unadopted Goose database)
    dir: apps/api
    cmds:
      - bash -c 'set -a && . ../../.env && set +a && cargo run --bin migrate -- up'

  db:adopt-goose:
    desc: Explicit one-time adoption of an existing Goose database; stop old writers first
    dir: apps/api
    cmds:
      - bash -c 'set -a && . ../../.env && set +a && cargo run --bin migrate -- adopt-goose'

  db:seed:
    deps: [catalog:check]
    dir: apps/api
    cmds:
      - bash -c 'set -a && . ../../.env && set +a && cargo run --bin seed'

  catalog:check:
    cmds:
      - pnpm --config.verify-deps-before-run=false --filter @touhouflandre/data validate

  gen:openapi:
    cmds:
      - node scripts/generate-rust-contracts.mjs

  gen:web:
    cmds:
      - pnpm --filter @touhouflandre/web gen:api

  gen:
    cmds:
      - task: gen:openapi
      - task: gen:web

  check:generated:
    cmds:
      - node scripts/generate-rust-contracts.mjs --check
      - task: gen:web
      - git diff --exit-code -- apps/web/src/generated

  check:ws-protocol:
    cmds:
      - pnpm check:ws-protocol

  check:boundaries:
    cmds:
      - pnpm check:multiplayer-boundaries

  test:rust:
    cmds:
      - cargo test --workspace --locked

  test:integration:
    desc: Run all Rust tests against an explicitly selected disposable Postgres server
    preconditions:
      - sh: test -n "$TEST_DATABASE_URL"
        msg: Set TEST_DATABASE_URL to a disposable local PostgreSQL server with CREATE DATABASE permission
    cmds:
      - cargo test --workspace --locked -- --include-ignored

  prod:build:
    cmds:
      - docker compose build

  prod:up:
    desc: Build, stop previous writers, migrate and seed, then start healthy services
    cmds:
      - docker compose build
      - docker compose up -d --wait postgres
      - docker compose stop api migrate seed
      - docker compose run --rm --no-deps migrate up
      - docker compose run --rm --no-deps seed
      - docker compose up -d --no-deps --wait api web

  prod:down:
    cmds:
      - docker compose down

  prod:logs:
    cmds:
      - docker compose logs -f
