# GET /api/catalog/characters — 兼容期内保留的完整可猜角色表
get:
  deprecated: true
  operationId: catalog_characters
  summary: 获取完整可猜角色表与当前题库版本
  tags:
    - catalog
  responses:
    "200":
      description: 已弃用的完整角色表；新客户端统一使用 /api/characters/search。
      content:
        application/json:
          schema:
            $ref: "../schemas/character.yaml#/CatalogCharacters"
    "503":
      description: 题库未初始化
      content:
        application/json:
          schema:
            $ref: "../schemas/common.yaml#/ErrorResponse"
