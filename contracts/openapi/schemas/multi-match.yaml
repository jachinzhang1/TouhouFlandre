# 多人场次 schema：MatchView 与按 memberId 关联的比分/再来一局集合
# 对应 docs/multiplayer.md（match 快照）

ScoringMode:
  type: string
  enum:
    - wins
    - points
    - placement

RuleSetRef:
  type: object
  description: 冻结的模式规则集引用；mode、key、version 必须共同解析。
  required:
    - mode
    - key
    - version
  properties:
    mode:
      $ref: "./multi-common.yaml#/MultiplayerMode"
    key:
      type: string
      minLength: 1
    version:
      type: integer
      minimum: 1

RelayLifeState:
  type: string
  enum:
    - healthy
    - near_death

RelayStandingView:
  type: object
  description: 接力专属比分；淘汰后的分数允许为负，不能与 race MemberScoreView 混用。
  required:
    - memberId
    - seat
    - score
    - status
    - lifeState
  properties:
    memberId:
      type: string
    seat:
      type: integer
      minimum: 1
      maximum: 8
    score:
      type: integer
    status:
      $ref: "#/MatchPlayerStatus"
    lifeState:
      $ref: "#/RelayLifeState"
    eliminatedStage:
      type: integer
      minimum: 1

RelayEncounterSummary:
  type: object
  required:
    - encounterId
    - encounterIndex
    - status
    - members
  properties:
    encounterId:
      type: string
    encounterIndex:
      type: integer
      minimum: 1
      maximum: 4
    status:
      type: string
      enum: [planned, countdown, playing, ended]
    members:
      type: array
      minItems: 2
      maxItems: 2
      items:
        $ref: "#/RelayEncounterMemberView"

RelayEncounterMemberView:
  type: object
  required:
    - memberId
    - seat
    - side
  properties:
    memberId:
      type: string
    seat:
      type: integer
      minimum: 1
      maximum: 8
    side:
      type: integer
      enum: [1, 2]

RelayEncounterView:
  type: object
  description: |
    一张 relay 棋盘的可见状态。进行中结构没有 answer 字段；终态答案由后续
    history/projector 契约以终态专用响应扩展，避免误泄露。
  required:
    - encounterId
    - encounterIndex
    - status
    - members
    - rows
  properties:
    encounterId:
      type: string
    encounterIndex:
      type: integer
      minimum: 1
      maximum: 4
    status:
      type: string
      enum: [planned, countdown, playing, ended]
    members:
      type: array
      minItems: 2
      maxItems: 2
      items:
        $ref: "#/RelayEncounterMemberView"
    startsAt:
      type: string
      format: date-time
    deadline:
      type: string
      format: date-time
    turnMemberId:
      type: string
    turnSeat:
      type: integer
      minimum: 1
      maximum: 8
    turnDeadline:
      type: string
      format: date-time
    rows:
      type: array
      items:
        $ref: "./multi-round.yaml#/RelayTurnRow"

RelayEncounterHistoryView:
  description: 终态 encounter 历史；只有该终态专用结构揭示答案。
  allOf:
    - $ref: "#/RelayEncounterView"
    - type: object
      required:
        - outcome
        - winnerMemberId
        - answer
      properties:
        status:
          type: string
          enum: [ended]
        outcome:
          type: string
          enum: [win, loss, draw, forfeit, timeout]
        winnerMemberId:
          type: string
          nullable: true
        answer:
          $ref: "./character.yaml#/Character"

RelayStageSettlementView:
  type: object
  required:
    - memberId
    - assignment
    - outcome
    - scoreBefore
    - scoreDelta
    - scoreAfter
    - lifeBefore
    - lifeAfter
  properties:
    memberId:
      type: string
    encounterId:
      type: string
    assignment:
      type: string
      enum: [paired, bye]
    outcome:
      type: string
      enum: [win, loss, draw, bye]
    scoreBefore:
      type: integer
    scoreDelta:
      type: integer
    scoreAfter:
      type: integer
    lifeBefore:
      $ref: "#/RelayLifeState"
    lifeAfter:
      $ref: "#/RelayLifeState"
    eliminatedStage:
      type: integer
      minimum: 1

RelayStageView:
  type: object
  required:
    - stageId
    - stageIndex
    - status
    - encounters
  properties:
    stageId:
      type: string
    stageIndex:
      type: integer
      minimum: 1
    status:
      type: string
      enum: [planned, playing, settling, ended]
    encounters:
      type: array
      minItems: 1
      maxItems: 4
      items:
        $ref: "#/RelayEncounterSummary"
    byeMemberId:
      type: string
    settlement:
      type: array
      items:
        $ref: "#/RelayStageSettlementView"
    encounterDetails:
      type: array
      description: 当前 stage 可见棋盘；按 encounterIndex、成员 side/seat 稳定排序。
      minItems: 1
      maxItems: 4
      items:
        $ref: "#/RelayEncounterView"

RelayStageHistoryView:
  type: object
  required:
    - stageId
    - stageIndex
    - status
    - encounters
    - settlement
  properties:
    stageId:
      type: string
    stageIndex:
      type: integer
      minimum: 1
    status:
      type: string
      enum: [ended]
    encounters:
      type: array
      minItems: 1
      maxItems: 4
      items:
        $ref: "#/RelayEncounterHistoryView"
    byeMemberId:
      type: string
    settlement:
      type: array
      items:
        $ref: "#/RelayStageSettlementView"

RelayMatchFragment:
  type: object
  required:
    - ruleSetRef
    - standings
  properties:
    ruleSetRef:
      $ref: "#/RuleSetRef"
    standings:
      type: array
      items:
        $ref: "#/RelayStandingView"
    currentStage:
      $ref: "#/RelayStageView"
    historySummary:
      type: array
      description: 紧凑历史摘要；完整终态棋盘由 history API 按需加载。
      items:
        $ref: "#/RelayStageView"

MatchPlayerStatus:
  type: string
  enum:
    - active
    - eliminated
    - left

MemberScoreView:
  type: object
  required:
    - memberId
    - seat
    - score
    - status
    - bestRoundScore
  properties:
    memberId:
      type: string
    seat:
      type: integer
      minimum: 1
      maximum: 8
    score:
      type: integer
      minimum: 0
    status:
      $ref: "#/MatchPlayerStatus"
    bestRoundScore:
      type: integer
      minimum: 0
    eliminatedRound:
      type: integer
      minimum: 1

MemberRankingView:
  type: object
  required:
    - memberId
    - seat
    - rank
    - score
    - status
  properties:
    memberId:
      type: string
    seat:
      type: integer
      minimum: 1
      maximum: 8
    rank:
      type: integer
      minimum: 1
    score:
      type: integer
      minimum: 0
    status:
      $ref: "#/MatchPlayerStatus"
    eliminatedRound:
      type: integer
      minimum: 1

MemberRematchReadyView:
  type: object
  required:
    - memberId
    - seat
    - ready
  properties:
    memberId:
      type: string
    seat:
      type: integer
      minimum: 1
      maximum: 8
    ready:
      type: boolean

MatchView:
  type: object
  description: 场次视图。场次自包含：比分、题库版本绑定（catalogVersion 见事件）、round_count 归场行。
  required:
    - matchIndex
    - scoringMode
    - rosterSize
    - targetWins
    - scores
    - roundIndex
    - maxRounds
    - rematchReady
    - catalogVersion
    - ruleSetRef
  properties:
    matchIndex:
      type: integer
      minimum: 0
      description: 场次序号；0 = 首场，1 = 第一次再来一局……
    scoringMode:
      $ref: "#/ScoringMode"
    rosterSize:
      type: integer
      minimum: 2
      maximum: 8
      description: 场次创建时冻结的实际 roster 人数。
    targetWins:
      type: integer
      minimum: 1
      description: wins 模式目标胜场；placement 模式保留兼容值但不参与终止判定。
    scores:
      type: array
      description: 按 seat 稳定排序的公开比分；身份关联使用 memberId。
      items:
        $ref: "#/MemberScoreView"
    roundIndex:
      type: integer
      minimum: 0
      description: 当前局号（0 = 本场尚未开局；对局中为当前局序号，1 起）。
    maxRounds:
      type: integer
      description: wins 模式按 BO 计算；placement 模式为 3 × rosterSize。
    rematchReady:
      type: array
      description: 按 seat 稳定排序的再来一局确认态（仅 finished 态有意义）。
      items:
        $ref: "#/MemberRematchReadyView"
    catalogVersion:
      type: string
      description: 本场绑定的题库版本。
    questionScope:
      $ref: "./question-scope.yaml#/QuestionScopeConfig"
    ruleSetRef:
      $ref: "#/RuleSetRef"
    relay:
      description: mode=relay 时的 relay-owned fragment；race 不返回此字段。
      $ref: "#/RelayMatchFragment"
